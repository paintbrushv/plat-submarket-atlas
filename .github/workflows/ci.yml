name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # geostack is a documented prerequisite, not a PyPI dep (name occupied
      # by an unrelated project). Its wheel deps (geopandas etc.) all ship
      # binary wheels for the three CI platforms.
      - name: Install geostack prerequisite (GitHub)
        run: |
          python -m pip install --upgrade pip
          pip install "geostack[viz] @ git+https://github.com/paintbrushv/geostack.git"

      - name: Install
        run: pip install ".[dev]"

      - name: Test
        run: pytest -v

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build (no deps — geostack is not on PyPI)
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Smoke test wheel in fresh venv
        run: python .github/scripts/smoke_wheel.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/